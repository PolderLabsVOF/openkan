name: CI

on:
  push:
    branches: [main, beta, dev]
  pull_request:
    branches: [main, beta, dev]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before publication
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      OPENKAN_SKIP_AGENT_INSTALL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run test:package
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: '*.tgz'
          retention-days: 14
          if-no-files-found: error

  required:
    name: CI required
    if: always()
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Node version
        env:
          RESULT: ${{ needs.package.result }}
        run: test "$RESULT" = success
